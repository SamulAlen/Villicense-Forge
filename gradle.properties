# Java 17 required for Minecraft 1.20.1 / Forge
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Let Gradle locate the JDK 17 toolchain without manually switching JAVA_HOME.
# Adjust this path to your local JDK 17 install if it differs.
org.gradle.java.installations.paths=D:\\Program Files\\Java\\jdk-17.0.16

## Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
# The Forge version we develop against. The mod declares dependency range [47.4.10,)
forge_version=47.4.10
# Lower bound of Forge the mod supports
forge_min_version=47.4.10
loader_version_range=[47.4.10,)
mappings_channel=official
mappings_version=1.20.1

## Mod Properties
mod_id=villicense
mod_name=Villicense (Forge)
mod_license=LGPL-3.0
mod_version=1.0.1
mod_group_id=com.plr.villicense
mod_authors=qwaasdqw,Tapio,Kennrou_Holo
mod_description=A license for villagers - check & change their job sites or beds
